name: infant_hearing_app
description: Baalshravya — Early Infant Hearing Detection System
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.5.2
  go_router: ^13.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # sqflite and sqflite_common_ffi are NOT needed — LocalStorageService
  # uses SharedPreferences only. No SQLite calls exist anywhere in the codebase.
  # DO NOT ADD sqflite.

  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  http: ^1.2.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1

  # 'any' lets flutter_localizations resolve intl internally without conflict
  intl: ^0.20.2

  audioplayers: ^6.1.1
  camera: ^0.11.0+2
  path_provider: ^2.1.3
  path: ^1.9.0
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_pose_detection: ^0.12.0
  google_fonts: ^6.2.1

  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  uuid: ^4.3.3
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.1.2
  syncfusion_flutter_charts: ^28.1.38

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  generate: false
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - lib/core/localization/l10n/app_en.arb
    - lib/core/localization/l10n/app_hi.arb
    - lib/core/localization/l10n/app_kn.arb
    - lib/core/localization/l10n/app_mr.arb
