# Gradle & JVM settings
# Reduced Xmx to 4G for better daemon stability; 8G can cause registry issues on some systems.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Kotlin Incremental Compilation Stabilization
# Disabling incremental compilation fixes "Could not close incremental caches" errors.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false
kotlin.code.style=official

# Gradle Performance & Reliability
org.gradle.daemon=true
org.gradle.parallel=true
# Disabling build cache temporarily to clear any corrupted entries causing "Storage already registered"
org.gradle.caching=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# Opt in only when using AGP 9+ (see https://developer.android.com/build/releases/agp-9-0-0-release-notes)
android.newDsl=false
